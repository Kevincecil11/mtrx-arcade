<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Checkers · MTRX™ Arcade</title><meta name="description" content="Checkers against an AI with five real difficulty levels, visual move replays, illustrated strategy and drills. Designed by MTRX™.">
<link rel="stylesheet" href="assets/mtrx-theme.css"><link rel="stylesheet" href="assets/arcade.css"><link rel="stylesheet" href="assets/checkers.css">
</head><body data-board="walnut">
<div class="topbar"><a href="index.html" id="home" aria-label="MTRX Arcade home"></a><span class="crumb">Arcade / Checkers</span><span class="spacer"></span>
<button class="mtrx-btn mtrx-btn--secondary sm" id="learnBtn"><span class="long">How to play &amp; strategy</span><span class="short">Learn</span></button>
<div class="mtrx-segmented" id="themeSeg"><button aria-pressed="true" data-t="">Light</button><button aria-pressed="false" data-t="dark">Dark</button></div></div>
<main><div class="ck-wrap">
<section class="board-col" aria-label="Board">
  <div class="style-menu bsize" id="styleMenu" role="group" aria-label="Board style"></div>
  <div class="review-bar bsize" id="reviewBar" hidden><div><span class="mtrx-label" style="margin:0">Replay</span><b id="revTxt"></b></div>
    <div class="btn-row"><button class="mtrx-btn mtrx-btn--ghost sm" id="revPrev" aria-label="Previous move">‹ Prev</button><button class="mtrx-btn mtrx-btn--ghost sm" id="revNext" aria-label="Next move">Next ›</button><button class="mtrx-btn mtrx-btn--primary sm" id="revLive">Back to game</button></div></div>
  <div class="cboard bsize" id="board"><div class="squares" id="squares"></div><div class="pieces" id="pieces"></div><svg class="arrows" id="arrows" viewBox="0 0 8 8" aria-hidden="true"></svg></div>
  <div class="below bsize">
    <div class="status" id="status" aria-live="polite">Setting up the board…</div>
    <div class="under-row"><div class="tally" id="tally"></div>
      <div class="btn-row"><button class="mtrx-btn mtrx-btn--primary sm" id="newBtn">New game</button><button class="mtrx-btn mtrx-btn--secondary sm" id="undoBtn">Undo</button><button class="mtrx-btn mtrx-btn--secondary sm" id="hintBtn">Best move?</button></div></div>
  </div>
</section>
<aside class="panel">
  <div><div class="mtrx-label">MTRX™ Arcade</div><h1>Checkers</h1></div>
  <div><div class="mtrx-label">Difficulty</div><div class="mtrx-segmented diff" id="diffSeg"></div><p class="lvl-note" id="lvlNote"></p></div>
  <div class="opts">
    <div><div class="mtrx-label">You play</div><div class="mtrx-segmented" id="sideSeg"><button data-s="1">Black · first</button><button data-s="-1">White</button></div></div>
    <div><div class="mtrx-label">Jumps</div><div class="mtrx-segmented" id="ruleSeg"><button data-f="0">Optional</button><button data-f="1">Forced</button></div></div>
  </div>
  <div id="coach"></div>
  <div><div class="mtrx-label">Moves · tap one to replay it</div><div class="moves" id="moves"></div></div>
</aside>
</div></main>
<div class="footer-wrap"><footer class="mtrx-credit"><span>Designed by MTRX™</span><span>MTRX checkers engine</span><span>mtrxdigital.com</span></footer></div>
<script type="module" src="js/checkers.js"></script></body></html>
